services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    container_name: resume_analysis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-passwordnamin}
      POSTGRES_DB: ${DB_NAME:-automated_resume_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-automated_resume_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Redis Broker & Cache ---
  redis:
    image: redis:7-alpine
    container_name: resume_analysis_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- FastAPI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_analysis_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-passwordnamin}@db:5432/${DB_NAME:-automated_resume_db}
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_PORT=5432
      - PORT=8000
      - AUTO_SEED_DEMO_DATA=${AUTO_SEED_DEMO_DATA:-true}
    # FastAPI is reached through the frontend Nginx gateway inside Docker.
    # Keeping it off the host avoids port conflicts with local dev servers.
    # Uncomment a ports block for direct host access if needed.
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  # --- Celery AI Background Worker ---
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_analysis_worker
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-passwordnamin}@db:5432/${DB_NAME:-automated_resume_db}
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network

  # --- React Vite Frontend & Nginx Gateway ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ""
    container_name: resume_analysis_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - app-network

  # --- Cloudflare Tunnel (Live Public Access) ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: resume_analysis_tunnel
    restart: unless-stopped
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate --url http://frontend:80}
    depends_on:
      - frontend
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  app-network:
    driver: bridge

services:
  - type: web
    name: resume-analyzer-backend
    env: docker
    region: oregon # Render default
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: "http://localhost:5173/" # Update this to your deployed frontend URL
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString

databases:
  - name: resume-analyzer-db
    databaseName: resume_analyzer
    user: admin
    plan: free
